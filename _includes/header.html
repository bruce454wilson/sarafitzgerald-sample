<header class="site-header">
<div class="wrap head-inner">
<a class="brand" href="/">
<span class="name">{{ site.title }}</span>
<span class="tag">{{ site.tagline }}</span>
</a>
<details class="menu">
<summary aria-label="Menu"><span></span><span></span><span></span></summary>
<nav>
<ul>
{% for item in site.data.nav %}
<li{% if item.children %} class="has-sub"{% endif %}>
<a href="{{ item.url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
{% if item.children %}<ul class="sub">
{% assign bs = site.books | sort: 'order' %}
{% for b in bs %}<li><a href="{{ b.url }}">{{ b.title }}</a></li>{% endfor %}
</ul>{% endif %}
</li>
{% endfor %}
</ul>
</nav>
</details>
</div>
</header>
